# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:  
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Harmony.sln

      - name: Format check
        run: dotnet format Harmony.sln --verify-no-changes --verbosity diagonstic

      - name: Build
        run: dotnet build Harmony.sln --no-restore --configuration Release
      - name: Test 
        run: dotnet test Harmony.sln --no-build --configuratoin Release --verbosity normal
